version: "3.1"

services:
  w3schools-db:
    image: biarms/mysql:5.7
    # image: mysql:8
    restart: always
    environment:
      MYSQL_USER: feusi
      MYSQL_PASSWORD: feusi
      MYSQL_ROOT_PASSWORD: &mysql-root-password root
      MYSQL_DATABASE: w3schools
    volumes:
      - ./data/mysql-arm:/var/lib/mysql
      - ./init-mysql:/docker-entrypoint-initdb.d
    ports:
      # Use non standard port to avoid clashes
      - 3309:3306

  rest-api:
    build: ./rest-api
    restart: always
    depends_on:
      - w3schools-db
    ports:
      - 3000:3000
    environment:
      - DB_HOST=w3schools-db
      - DB_PORT=3306

  sql-runner:
    build: ./sql-runner
    restart: always
    depends_on:
      - w3schools-db
    ports:
      # Only reachable from this computer: the slides in its browser call it
      - 127.0.0.1:3001:3001
    environment:
      MYSQL_HOST: w3schools-db
      MYSQL_PORT: "3306"
      MYSQL_ROOT_PASSWORD: *mysql-root-password
